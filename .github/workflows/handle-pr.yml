name: Handle PR
on:
  pull_request:
    branches:
      - prod
      - staging

jobs:
  plan-platform:
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: thompsonbear/homelab/.github/workflows/tf-plan.yml@prod
    with:
      environment: ${{ github.base_ref }}
      storage_account_container_name: platform
      sha: ${{ github.event.pull_request.head.sha }}
      working_dir: "./platform"
    secrets: inherit

